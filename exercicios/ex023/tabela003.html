<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        bodt{
        font-family: Arial, Helvetica, sans-serif;
        }
        table{
        border-collapse: collapse;
        width: 400px;
        }
        td{
        border: 1px solid black;
        padding: 10px;
        text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de células
    </h1>
    <table>
        <tbody>
            <tr>
                <td>a</td>
                <td colspan="2">b</td>
            </tr>
            <tr>
                <td rowspan="3">d</td>
                <td>e</td>
                <td rowspan="2">f</td>
            </tr>
            <tr>
                <td>h</td>
            </tr>
            <tr>
                <td>k</td>
                <td>l</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
