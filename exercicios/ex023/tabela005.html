<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabelas</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;}
            table{width:400px;
            border-collapse:collapse;
        }
        caption{font-size: 1.5em;
            font-weight:bold;
        }
        th, td{
        border: 1px solid black;
        padding:10px;
        text-align:center;}

        col.nome{
        background-color:lightblue}
        col.sxidd{
        background-color:lightgreen}
        col.prof{
        background-color:lightyellow}
    </style>
</head>
<body>
    <h1>Exercício de tabelas</h1>
    <table>
        <colgroup>
        <col class="nome">
        <col class="sxidd" span="2">
        <col class="prof">
    </colgroup>
        <caption>Cadastro</caption>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Sexo</th>
                <th>Idade</th>
                <th>Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Júlia Maria</td>
                <td>F</td>
                <td>17</td>
                <td>Fonoaudióloga</td>
            </tr>
            <tr>
                <td>João Pedro</td>
                <td>M</td>
                <td>19</td>
                <td>Desenvolvedor</td>
            </tr>
            <tr>
                <td>Lucas</td>
                <td>M</td>
                <td>24</td>
                <td>Farmaceutico</td>
            </tr>
            <tr>
                <td>Vanderlan</td>
                <td>M</td>
                <td>49</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Vinicius</td>
                <td>M</td>
                <td>25</td>
                <td>Serviços gerais</td>
            </tr>
            <tr>
                <td>Emilly</td>
                <td>F</td>
                <td>23</td>
                <td>Fonaudiológa</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
