<head>

            padding: 10px;
            text-align: center;
            flex-basis: 160px;
        }

</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">Bbbbbbbbbb</div>
        <div class="item">C</div>
        <div class="item">Ddddddd</div>
        <div class="item">E</div>
        <div class="item">Fffffffff</div>
        <div class="item">G</div>
    </div>
</body>
</html>
